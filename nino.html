<style>
  :root{
    --bg:#0a0a0a;
    --bg-elevated:#1a1013;
    --bg-input:#1f1417;
    --line:#33222a;
    --text:#f2e9ec;
    --text-dim:#9a8891;
    --accent:#e85c9c;
    --accent-dim:#a13d6d;
    --danger:#e0637a;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 18px;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brand .dot{
    width:9px;height:9px;border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 8px var(--accent);
  }
  .brand h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:1.25rem;
    margin:0;
    letter-spacing:0.01em;
  }
  .icon-btn{
    background:none;border:none;color:var(--text-dim);
    cursor:pointer;padding:8px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;
  }
  .icon-btn:hover{color:var(--text);background:var(--bg-elevated);}
  .icon-btn svg{width:20px;height:20px;}

  main{
    flex:1;
    overflow-y:auto;
    padding:20px 16px 12px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .empty{
    margin:auto;
    text-align:center;
    color:var(--text-dim);
    max-width:280px;
    line-height:1.5;
  }
  .empty .dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--accent);
    margin:0 auto 14px;
    box-shadow:0 0 12px var(--accent);
  }

  .row{display:flex;max-width:88%;}
  .row.user{align-self:flex-end;justify-content:flex-end;}
  .row.ai{align-self:flex-start;}
  .bubble{
    padding:11px 14px;
    border-radius:14px;
    line-height:1.45;
    font-size:0.97rem;
    white-space:pre-wrap;
    word-wrap:break-word;
  }
  .row.user .bubble{
    background:var(--accent-dim);
    color:#f9eef3;
    border-bottom-right-radius:4px;
  }
  .row.ai .bubble{
    background:var(--bg-elevated);
    border-left:2px solid var(--accent);
    border-bottom-left-radius:4px;
  }
  .row.ai .bubble.typing{color:var(--text-dim);font-style:italic;}

  footer{
    padding:12px 14px calc(12px + env(safe-area-inset-bottom, 0px));
    border-top:1px solid var(--line);
    flex-shrink:0;
  }
  .input-wrap{
    display:flex;
    align-items:flex-end;
    gap:8px;
    background:var(--bg-input);
    border:1px solid var(--line);
    border-radius:16px;
    padding:8px 8px 8px 16px;
  }
  textarea{
    flex:1;
    background:none;
    border:none;
    outline:none;
    resize:none;
    color:var(--text);
    font-family:inherit;
    font-size:0.97rem;
    line-height:1.4;
    max-height:110px;
    padding:6px 0;
  }
  textarea::placeholder{color:var(--text-dim);}
  .send-btn{
    background:var(--accent);
    border:none;
    width:36px;height:36px;
    border-radius:11px;
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    color:#1a0a10;
  }
  .send-btn:disabled{opacity:0.4;cursor:default;}
  .send-btn svg{width:17px;height:17px;}

  .attach-btn{
    background:none;border:none;
    width:36px;height:36px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    color:var(--text-dim);cursor:pointer;
    border-radius:11px;
  }
  .attach-btn:hover{color:var(--accent);background:var(--bg-elevated);}
  .attach-btn svg{width:19px;height:19px;}

  .preview-chip{
    display:flex;align-items:center;gap:10px;
    background:var(--bg-input);
    border:1px solid var(--line);
    border-radius:12px;
    padding:6px;
    margin-bottom:8px;
  }
  .preview-chip.hidden{display:none;}
  .preview-chip img{
    width:40px;height:40px;object-fit:cover;border-radius:8px;
  }
  .preview-chip span{flex:1;font-size:0.82rem;color:var(--text-dim);}
  .preview-chip button{
    background:none;border:none;color:var(--text-dim);
    cursor:pointer;padding:4px;
  }

  .bubble img.chat-img{
    display:block;
    max-width:100%;
    border-radius:10px;
    margin-top:6px;
  }
  .bubble img.chat-img:first-child{margin-top:0;}

  /* Settings overlay */
  .overlay{
    position:fixed;inset:0;
    background:rgba(10,11,14,0.75);
    display:flex;align-items:flex-end;justify-content:center;
    z-index:10;
  }
  .overlay.hidden{display:none;}
  .sheet{
    background:var(--bg-elevated);
    width:100%;max-width:480px;
    border-radius:20px 20px 0 0;
    padding:22px 20px calc(22px + env(safe-area-inset-bottom, 0px));
    max-height:85vh;
    overflow-y:auto;
    border-top:1px solid var(--line);
  }
  .sheet h2{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:1.15rem;
    margin:0 0 4px;
  }
  .sheet .sub{color:var(--text-dim);font-size:0.85rem;margin:0 0 18px;}
  label{
    display:block;
    font-size:0.8rem;
    color:var(--text-dim);
    margin:14px 0 6px;
  }
  input[type=text], input[type=password], textarea.field{
    width:100%;
    background:var(--bg-input);
    border:1px solid var(--line);
    border-radius:10px;
    color:var(--text);
    padding:11px 12px;
    font-family:inherit;
    font-size:0.92rem;
    outline:none;
  }
  input[type=text]:focus, input[type=password]:focus, textarea.field:focus{
    border-color:var(--accent-dim);
  }
  textarea.field{resize:vertical;min-height:70px;}
  select.field{
    background:var(--bg-input);
    border:1px solid var(--line);
    color:var(--text);
    outline:none;
    appearance:none;
    -webkit-appearance:none;
  }
  select.field:focus{border-color:var(--accent-dim);}
  .row-actions{display:flex;gap:10px;margin-top:20px;}
  .btn{
    flex:1;
    padding:12px;
    border-radius:11px;
    border:none;
    font-family:inherit;
    font-size:0.92rem;
    font-weight:500;
    cursor:pointer;
  }
  .btn.primary{background:var(--accent);color:#20232e;}
  .btn.ghost{background:none;border:1px solid var(--line);color:var(--text);}
  .btn.danger{background:none;border:1px solid var(--danger);color:var(--danger);}
  .toggle-row{
    display:flex;align-items:center;justify-content:space-between;
    margin-top:16px;
  }
  .switch{
    width:42px;height:24px;border-radius:20px;
    background:var(--line);position:relative;cursor:pointer;
    flex-shrink:0;transition:background 0.15s;
  }
  .switch.on{background:var(--accent-dim);}
  .switch::after{
    content:'';position:absolute;top:3px;left:3px;
    width:18px;height:18px;border-radius:50%;background:#f0ede6;
    transition:left 0.15s;
  }
  .switch.on::after{left:21px;}
  .hint{font-size:0.78rem;color:var(--text-dim);margin-top:6px;line-height:1.4;}
  .hint a{color:var(--accent);}
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="dot"></span>
    <h1 id="assistantName">Nino</h1>
  </div>
  <button class="icon-btn" onclick="openSettings()" aria-label="Ajustes">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2-1.6-2-3.4-2.4.7a7.6 7.6 0 0 0-1.7-1l-.4-2.5h-4l-.4 2.5a7.6 7.6 0 0 0-1.7 1l-2.4-.7-2 3.4 2 1.6a7.5 7.5 0 0 0 0 2l-2 1.6 2 3.4 2.4-.7c.5.4 1.1.75 1.7 1l.4 2.5h4l.4-2.5a7.6 7.6 0 0 0 1.7-1l2.4.7 2-3.4-2-1.6Z"/></svg>
  </button>
</header>

<main id="chat">
  <div class="empty" id="emptyState">
    <div class="dot"></div>
    Escríbele algo a Nino para empezar.<br>Recuerda las conversaciones anteriores.
  </div>
</main>

<footer>
  <div class="preview-chip hidden" id="previewChip">
    <img id="previewImg" src="" alt="">
    <span>Imagen adjunta</span>
    <button onclick="removeAttachedImage()" aria-label="Quitar imagen">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div class="input-wrap">
    <button class="attach-btn" onclick="document.getElementById('fileInput').click()" aria-label="Adjuntar imagen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M21 11.5 12.4 20a5 5 0 0 1-7-7l8-8a3.5 3.5 0 0 1 5 5l-7.9 7.9a2 2 0 0 1-2.8-2.8l7.2-7.2"/></svg>
    </button>
    <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleImageSelect(event)">
    <textarea id="input" rows="1" placeholder="Escribe un mensaje… o pide una imagen"></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()" aria-label="Enviar">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 11.5 20.5 4 13 21.5l-2.5-7L3 11.5Z"/></svg>
    </button>
  </div>
</footer>

<div class="overlay hidden" id="settingsOverlay">
  <div class="sheet">
    <h2>Ajustes de Nino</h2>
    <p class="sub">Se guardan solo en este dispositivo.</p>

    <label for="apiKey">API key de Gemini</label>
    <input type="password" id="apiKey" placeholder="Pega tu key aquí">
    <p class="hint">Consíguela gratis en <a href="https://aistudio.google.com" target="_blank">aistudio.google.com</a></p>

    <label for="modelName">Modelo</label>
    <input type="text" id="modelName" placeholder="gemini-3.5-flash-lite">

    <label for="personality">Personalidad</label>
    <textarea class="field" id="personality" placeholder="Eres Nino, mi asistente personal. Responde breve y directo."></textarea>

    <div class="toggle-row">
      <span>Leer respuestas en voz alta</span>
      <div class="switch" id="voiceToggle" onclick="toggleVoice()"></div>
    </div>

    <label for="voiceSelect">Voz</label>
    <select id="voiceSelect" class="field" style="width:100%;padding:11px 12px;"></select>
    <p class="hint">Las voces disponibles dependen de tu dispositivo y navegador.</p>

    <div class="row-actions">
      <button class="btn ghost" onclick="closeSettings()">Cerrar</button>
      <button class="btn primary" onclick="saveSettings()">Guardar</button>
    </div>
    <div class="row-actions">
      <button class="btn danger" onclick="clearHistory()">Borrar historial de chat</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'nino_settings_v1';
const HISTORY_KEY = 'nino_history_v1';

let settings = loadSettings();
let history = loadHistory();

function loadSettings(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {
    apiKey:'',
    model:'gemini-3.5-flash-lite',
    personality:'Eres Nino, mi asistente personal. Responde de forma breve, cálida y directa.',
    voice:false,
    voiceName:''
  };
}
function saveSettingsToStorage(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
}
function loadHistory(){
  try{
    const raw = localStorage.getItem(HISTORY_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return [];
}
function saveHistoryToStorage(){
  localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
}

function openSettings(){
  document.getElementById('apiKey').value = settings.apiKey || '';
  document.getElementById('modelName').value = settings.model || 'gemini-3.5-flash-lite';
  document.getElementById('personality').value = settings.personality || '';
  document.getElementById('voiceToggle').classList.toggle('on', !!settings.voice);
  populateVoiceSelect();
  document.getElementById('settingsOverlay').classList.remove('hidden');
}

let availableVoices = [];
function populateVoiceSelect(){
  if(!('speechSynthesis' in window)) return;
  availableVoices = speechSynthesis.getVoices();
  const select = document.getElementById('voiceSelect');
  if(!availableVoices.length){
    select.innerHTML = '<option value="">Voz predeterminada</option>';
    return;
  }
  // Voces en español primero, luego el resto
  const sorted = [...availableVoices].sort((a, b) => {
    const aEs = a.lang.startsWith('es') ? 0 : 1;
    const bEs = b.lang.startsWith('es') ? 0 : 1;
    return aEs - bEs;
  });
  select.innerHTML = '<option value="">Voz predeterminada</option>' +
    sorted.map(v => `<option value="${v.name}" ${v.name === settings.voiceName ? 'selected' : ''}>${v.name} (${v.lang})</option>`).join('');
}
if('speechSynthesis' in window){
  speechSynthesis.onvoiceschanged = populateVoiceSelect;
}
function closeSettings(){
  document.getElementById('settingsOverlay').classList.add('hidden');
}
function toggleVoice(){
  document.getElementById('voiceToggle').classList.toggle('on');
}
function saveSettings(){
  settings.apiKey = document.getElementById('apiKey').value.trim();
  settings.model = document.getElementById('modelName').value.trim() || 'gemini-3.5-flash-lite';
  settings.personality = document.getElementById('personality').value.trim();
  settings.voice = document.getElementById('voiceToggle').classList.contains('on');
  settings.voiceName = document.getElementById('voiceSelect').value;
  saveSettingsToStorage();
  closeSettings();
}
function clearHistory(){
  if(!confirm('¿Borrar todo el historial de chat?')) return;
  history = [];
  saveHistoryToStorage();
  renderChat();
  closeSettings();
}

function renderChat(){
  const chat = document.getElementById('chat');
  chat.innerHTML = '';
  if(history.length === 0){
    chat.innerHTML = '<div class="empty" id="emptyState"><div class="dot"></div>Escríbele algo a Nino para empezar.<br>Recuerda las conversaciones anteriores.</div>';
    return;
  }
  history.forEach(m => {
    const row = document.createElement('div');
    row.className = 'row ' + (m.role === 'user' ? 'user' : 'ai');
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    if(m.text) bubble.appendChild(document.createTextNode(m.text));
    if(m.image){
      const img = document.createElement('img');
      img.className = 'chat-img';
      img.src = m.image.url || `data:${m.image.mimeType};base64,${m.image.data}`;
      img.alt = 'imagen';
      bubble.appendChild(img);
    }
    row.appendChild(bubble);
    chat.appendChild(row);
  });
  chat.scrollTop = chat.scrollHeight;
}

function addTypingIndicator(label){
  const chat = document.getElementById('chat');
  const row = document.createElement('div');
  row.className = 'row ai';
  row.id = 'typingRow';
  row.innerHTML = `<div class="bubble typing">${label || 'escribiendo…'}</div>`;
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
}
function removeTypingIndicator(){
  const el = document.getElementById('typingRow');
  if(el) el.remove();
}

const input = document.getElementById('input');
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 110) + 'px';
});
input.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});

// ---- Imagen adjunta (para que Nino la vea) ----
let attachedImage = null; // {mimeType, data} - data en base64 sin prefijo

function handleImageSelect(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      // Redimensiona para no guardar imágenes enormes
      const maxSide = 1024;
      let { width, height } = img;
      if(width > maxSide || height > maxSide){
        const scale = maxSide / Math.max(width, height);
        width = Math.round(width * scale);
        height = Math.round(height * scale);
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
      attachedImage = { mimeType:'image/jpeg', data: dataUrl.split(',')[1] };
      document.getElementById('previewImg').src = dataUrl;
      document.getElementById('previewChip').classList.remove('hidden');
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
  event.target.value = '';
}
function removeAttachedImage(){
  attachedImage = null;
  document.getElementById('previewChip').classList.add('hidden');
}

// ---- Detectar pedidos de "genera una imagen de..." ----
function extractImagePrompt(text){
  const patterns = [
    /^dib[uú]jame?\s+/i,
    /^genera(me)?\s+una?\s+imagen\s+de\s+/i,
    /^genera(me)?\s+una?\s+imagen\s+/i,
    /^crea(me)?\s+una?\s+imagen\s+de\s+/i,
    /^crea(me)?\s+una?\s+imagen\s+/i,
    /^haz(me)?\s+una?\s+imagen\s+de\s+/i,
    /^haz(me)?\s+una?\s+imagen\s+/i,
    /^imagina\s+/i
  ];
  for(const p of patterns){
    if(p.test(text)) return text.replace(p, '').trim() || text;
  }
  return null;
}

// ---- Puente con la app de escritorio (pywebview) ----
function isDesktop(){
  return !!(window.pywebview && window.pywebview.api);
}

// Detecta comandos para la versión de escritorio: abrir apps, buscar en
// internet, o abrir algo en el navegador para que tú lo veas.
function parseCommand(text){
  const t = text.trim();
  let m;

  // "busca X en internet" / "búscame en internet X" / "busca X en google"
  m = t.match(/^busca(?:me)?\s+(.+?)\s+en\s+internet$/i) ||
      t.match(/^busca(?:me)?\s+en\s+internet\s+(.+)$/i) ||
      t.match(/^busca(?:me)?\s+(.+?)\s+en\s+google$/i);
  if(m) return { type:'search', query: m[1].trim() };

  // "ábreme X en el navegador" / "muéstrame X en internet"
  m = t.match(/^(?:ábreme|abreme|abre|muéstrame|muestrame)\s+(.+?)\s+en\s+(?:el\s+)?(?:navegador|internet)$/i);
  if(m) return { type:'open_browser', query: m[1].trim() };

  // "abre <app>" / "ejecuta <app>"
  m = t.match(/^(?:abre|abrir|ábreme|abreme|ejecuta)\s+(.+)$/i);
  if(m) return { type:'open_app', name: m[1].trim() };

  return null;
}

async function askGeminiOneOff(promptText){
  const model = settings.model || 'gemini-3.5-flash-lite';
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${settings.apiKey}`;
  const body = {
    contents: [{ role:'user', parts:[{ text: promptText }] }],
    ...(settings.personality ? { system_instruction: { parts: [{ text: settings.personality }] } } : {})
  };
  const res = await fetch(url, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body)
  });
  const data = await res.json();
  if(!res.ok) throw new Error(data?.error?.message || 'Error de la API');
  const reply = data?.candidates?.[0]?.content?.parts?.[0]?.text;
  if(!reply) throw new Error('Respuesta vacía');
  return reply;
}

async function handleDesktopCommand(command, sendBtn){
  if(!isDesktop()){
    history.push({ role:'ai', text:'Esa acción solo funciona en la app de escritorio de Nino (el companion que corre en tu PC). Desde el navegador no puedo abrir programas ni el navegador por ti.' });
    saveHistoryToStorage(); renderChat(); sendBtn.disabled = false;
    return;
  }

  if(command.type === 'open_app'){
    addTypingIndicator('abriendo ' + command.name + '…');
    const result = await window.pywebview.api.open_app(command.name);
    removeTypingIndicator();
    history.push({ role:'ai', text: result });
    saveHistoryToStorage(); renderChat(); sendBtn.disabled = false;
    return;
  }

  if(command.type === 'open_browser'){
    addTypingIndicator('abriendo en el navegador…');
    const result = await window.pywebview.api.open_url_or_search(command.query);
    removeTypingIndicator();
    history.push({ role:'ai', text: result });
    saveHistoryToStorage(); renderChat(); sendBtn.disabled = false;
    return;
  }

  if(command.type === 'search'){
    addTypingIndicator('buscando en internet…');
    const resultsText = await window.pywebview.api.search_web(command.query);
    removeTypingIndicator();
    if(!resultsText){
      history.push({ role:'ai', text:'No encontré resultados para eso.' });
      saveHistoryToStorage(); renderChat(); sendBtn.disabled = false;
      return;
    }
    addTypingIndicator();
    try{
      const augmented = `Resultados de una búsqueda web sobre "${command.query}":\n\n${resultsText}\n\nUsando esta información, responde breve y directo a: ${command.query}`;
      const reply = await askGeminiOneOff(augmented);
      removeTypingIndicator();
      history.push({ role:'ai', text: reply });
      saveHistoryToStorage(); renderChat();
      if(settings.voice) speak(reply);
    }catch(err){
      removeTypingIndicator();
      history.push({ role:'ai', text:'No pude responder: ' + err.message });
      saveHistoryToStorage(); renderChat();
    }
    sendBtn.disabled = false;
  }
}

async function sendMessage(){
  const text = input.value.trim();
  if(!text && !attachedImage) return;

  if(!settings.apiKey){
    openSettings();
    return;
  }

  const imageForThisTurn = attachedImage;
  const imgPrompt = !imageForThisTurn ? extractImagePrompt(text) : null;

  input.value = '';
  input.style.height = 'auto';
  history.push({
    role:'user',
    text,
    ...(imageForThisTurn ? { image: imageForThisTurn } : {})
  });
  removeAttachedImage();
  saveHistoryToStorage();
  renderChat();

  const sendBtn = document.getElementById('sendBtn');
  sendBtn.disabled = true;

  // Camino 1: pidieron generar una imagen (no pasa por Gemini)
  if(imgPrompt){
    addTypingIndicator('generando imagen…');
    const genUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(imgPrompt)}?width=1024&height=1024&nologo=true&seed=${Date.now()}`;
    removeTypingIndicator();
    history.push({ role:'ai', text:'Aquí tienes:', image:{ url: genUrl } });
    saveHistoryToStorage();
    renderChat();
    sendBtn.disabled = false;
    return;
  }

  // Camino 1b: comandos de escritorio (abrir apps, buscar/abrir en internet)
  const command = !imageForThisTurn ? parseCommand(text) : null;
  if(command){
    await handleDesktopCommand(command, sendBtn);
    return;
  }

  // Camino 2: pregunta normal (con o sin imagen adjunta) → Gemini
  addTypingIndicator();
  try{
    const reply = await askGemini();
    removeTypingIndicator();
    history.push({role:'ai', text: reply});
    saveHistoryToStorage();
    renderChat();
    if(settings.voice) speak(reply);
  }catch(err){
    removeTypingIndicator();
    history.push({role:'ai', text: 'No pude responder: ' + err.message});
    saveHistoryToStorage();
    renderChat();
  }finally{
    sendBtn.disabled = false;
  }
}

async function askGemini(){
  const model = settings.model || 'gemini-3.5-flash-lite';
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${settings.apiKey}`;

  // Construye el historial de conversación, incluyendo imágenes adjuntas si las hay
  const contents = history
    .filter(m => m.text || m.image?.data)
    .map(m => {
      const parts = [];
      if(m.text) parts.push({ text: m.text });
      if(m.image?.data){
        parts.push({ inline_data: { mime_type: m.image.mimeType, data: m.image.data } });
      }
      return { role: m.role === 'user' ? 'user' : 'model', parts };
    });

  const body = {
    contents,
    ...(settings.personality ? {
      system_instruction: { parts: [{ text: settings.personality }] }
    } : {})
  };

  const res = await fetch(url, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body)
  });

  const data = await res.json();
  if(!res.ok){
    throw new Error(data?.error?.message || 'Error de la API');
  }
  const reply = data?.candidates?.[0]?.content?.parts?.[0]?.text;
  if(!reply) throw new Error('Respuesta vacía');
  return reply;
}

function speak(text){
  if(!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'es-ES';
  if(settings.voiceName){
    const chosen = speechSynthesis.getVoices().find(v => v.name === settings.voiceName);
    if(chosen){
      u.voice = chosen;
      u.lang = chosen.lang;
    }
  }
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

// Primera vez: si no hay key guardada, abre ajustes directo
renderChat();
if(!settings.apiKey){
  setTimeout(openSettings, 300);
}
</script>
</body>
</html>
